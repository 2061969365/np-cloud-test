name: np-client-tun
on: workflow_dispatch
jobs:
  c:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      NP_CPCID: '685006'
      NP_PCID: '685005'
      NP_CODE: '91505506'
      NP_CONPWD: 'qaz123wsx456'
      NP_WATCH: '150'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 2061969365/natpierce-re
          token: ${{ secrets.NP_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome
      - name: open firewall for punch
        shell: pwsh
        run: |
          netsh advfirewall set allprofiles state off
          netsh advfirewall show allprofiles state
      - name: start client with TUN
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList '-u','tools/np_client.py' -PassThru -RedirectStandardOutput client.log -RedirectStandardError client.err
          $p.Id | Out-File client.pid
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $log = Get-Content client.log -Raw -ErrorAction SilentlyContinue
            if ($log -match 'READY tun=') {
              $ip = Get-NetIPAddress -IPAddress 10.6.22.2 -ErrorAction SilentlyContinue
              Write-Host "TUN READY: $($ip.IPAddress)/$($ip.PrefixLength) on $($ip.InterfaceAlias)"
              $ok = $true; break
            }
            if ($p.HasExited) { Write-Host "client exited rc=$($p.ExitCode)"; break }
          }
          if (-not $ok) { Write-Host 'TUN NOT READY' }
          Get-NetAdapter -Name natpierce-cli | Format-Table Name,Status,ifIndex,MediaConnectionState -AutoSize
          Get-NetIPAddress -IPAddress 10.6.22.2 | Format-List IPAddress,PrefixLength,AddressState,PrefixOrigin,SuffixOrigin,InterfaceIndex,InterfaceAlias,SkipAsSource
          Get-NetIPInterface -InterfaceAlias natpierce-cli -AddressFamily IPv4 | Format-List InterfaceAlias,InterfaceIndex,InterfaceMetric,NlMtu,ConnectionState,DadState
          Write-Host '=== Find-NetRoute 10.6.22.1 (before) ==='
          Find-NetRoute -RemoteIPAddress 10.6.22.1 -ErrorAction SilentlyContinue | Format-List *
          Write-Host '=== routes 10.6.22 (before) ==='
          Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -like '10.6.22*' } | Sort-Object DestinationPrefix,RouteMetric | Format-Table -AutoSize
          Write-Host '=== client.log (post-TUN) ==='
          Get-Content client.log -Tail 40
      - name: ping and tcp through tunnel
        shell: pwsh
        run: |
          Write-Host '=== ping 10.6.22.1 (before route fix) ==='
          ping -n 2 10.6.22.1
          Write-Host '=== remove gateway route, force on-link metric 1 ==='
          route delete 10.6.22.0 mask 255.255.255.0 10.6.22.1 2>&1 | Write-Host
          $idx = (Get-NetAdapter -Name natpierce-cli).ifIndex
          route add 10.6.22.0 mask 255.255.255.0 0.0.0.0 if $idx metric 1 2>&1 | Write-Host
          Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -like '10.6.22*' } | Sort-Object DestinationPrefix,RouteMetric | Format-Table -AutoSize
          Find-NetRoute -RemoteIPAddress 10.6.22.1 -ErrorAction SilentlyContinue | Format-List *
          Write-Host '=== ping 10.6.22.1 (after route fix) ==='
          ping -n 4 10.6.22.1
          Write-Host '=== ping -S 10.6.22.2 ==='
          ping -n 2 -S 10.6.22.2 10.6.22.1
          Write-Host '=== tcp 10.6.22.1:47989 (Sunshine) ==='
          $r = Test-NetConnection 10.6.22.1 -Port 47989 -InformationLevel Quiet -WarningAction SilentlyContinue
          Write-Host "TCP47989=$r"
          if (-not $r) {
            Write-Host '=== retry: delete all 10.6.22 routes, add on-link, ping ==='
            route delete 10.6.22.0 2>&1 | Write-Host
            route add 10.6.22.0 mask 255.255.255.0 0.0.0.0 if $idx metric 1 2>&1 | Write-Host
            ping -n 2 10.6.22.1
            $r = Test-NetConnection 10.6.22.1 -Port 47989 -InformationLevel Quiet -WarningAction SilentlyContinue
            Write-Host "TCP47989_retry=$r"
          }
      - name: client logs
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== client.log ==='
          Get-Content client.log -Tail 150 -ErrorAction SilentlyContinue
          Write-Host '=== client.err ==='
          Get-Content client.err -Tail 40 -ErrorAction SilentlyContinue
